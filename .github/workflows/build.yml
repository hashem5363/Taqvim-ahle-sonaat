          cat > $P/app/src/main/java/ir/hashem/taqvim/Loc.java <<'EOF'
          package ir.hashem.taqvim;

          import android.content.Context;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;

          public class Loc {
              @SuppressWarnings("MissingPermission")
              static void get(final MainActivity act, final String cb) {
                  final LocationManager lm = (LocationManager) act.getSystemService(Context.LOCATION_SERVICE);
                  if (lm == null) { fail(act, cb, "no-service"); return; }
                  Location best = null;
                  try {
                      for (String pr : lm.getProviders(true)) {
                          Location l = lm.getLastKnownLocation(pr);
                          if (l != null && (best == null || l.getTime() > best.getTime())) best = l;
                      }
                  } catch (Exception e) { }
                  if (best != null && System.currentTimeMillis() - best.getTime() < 6L * 3600000L) { ok(act, cb, best); return; }
                  final boolean[] done = {false};
                  final Location fallback = best;
                  final LocationListener ls = new LocationListener() {
                      public void onLocationChanged(Location l) {
                          if (done[0]) return; done[0] = true;
                          try { lm.removeUpdates(this); } catch (Exception e) { }
                          ok(act, cb, l);
                      }
                      public void onStatusChanged(String p, int s, Bundle b) { }
                      public void onProviderEnabled(String p) { }
                      public void onProviderDisabled(String p) { }
                  };
                  try {
                      if (lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER))
                          lm.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 0, 0, ls, Looper.getMainLooper());
                      if (lm.isProviderEnabled(LocationManager.GPS_PROVIDER))
                          lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 0, 0, ls, Looper.getMainLooper());
                  } catch (Exception e) { }
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if (done[0]) return; done[0] = true;
                      try { lm.removeUpdates(ls); } catch (Exception e) { }
                      if (fallback != null) ok(act, cb, fallback); else fail(act, cb, "timeout");
                  }, 25000);
              }

              static void ok(MainActivity act, String cb, Location l) {
                  act.js("window.__nativeCb&&window.__nativeCb(" + AppBridge.q(cb) + ",true," + AppBridge.q(l.getLatitude() + "," + l.getLongitude()) + ")");
              }

              static void fail(MainActivity act, String cb, String why) {
                  act.js("window.__nativeCb&&window.__nativeCb(" + AppBridge.q(cb) + ",false," + AppBridge.q(why) + ")");
              }
          }
          EOF

          cat > $P/app/src/main/java/ir/hashem/taqvim/MainActivity.java <<'EOF'
          package ir.hashem.taqvim;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import java.util.Locale;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.view.Surface;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity implements SensorEventListener {
              TextToSpeech tts; boolean ttsReady = false; String[] pendingSpeak = null;
              void speak(final String text, final String lang) {
                  runOnUiThread(() -> {
                      if (tts == null) {
                          pendingSpeak = new String[]{text, lang};
                          tts = new TextToSpeech(this, st -> { ttsReady = st == TextToSpeech.SUCCESS; if (ttsReady && pendingSpeak != null) { say(pendingSpeak[0], pendingSpeak[1]); pendingSpeak = null; } });
                      } else if (ttsReady) say(text, lang);
                  });
              }
              void say(String text, String lang) {
                  Locale l = "ar".equals(lang) ? new Locale("ar") : Locale.US;
                  int r = tts.setLanguage(l);
                  if (r < 0) js("window.toast&&toast('صدای این زبان روی گوشی نصب نیست')");
                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "u1");
              }
              @Override
              protected void onDestroy() { if (tts != null) tts.shutdown(); super.onDestroy(); }
              SensorManager sm; boolean compassOn = false; long lastSend = 0;
              final float[] rot = new float[9], ori = new float[3], grav = new float[3], mag = new float[3];
              boolean hasG = false, hasM = false;

              void startCompass() {
                  runOnUiThread(() -> {
                      if (sm == null) sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                      if (sm == null) { js("window.__heading&&window.__heading(-1,0)"); return; }
                      sm.unregisterListener(this);
                      Sensor rv = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);
                      boolean ok;
                      if (rv != null) ok = sm.registerListener(this, rv, SensorManager.SENSOR_DELAY_GAME);
                      else {
                          Sensor a = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER), m = sm.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);
                          ok = a != null && m != null && sm.registerListener(this, a, SensorManager.SENSOR_DELAY_GAME) && sm.registerListener(this, m, SensorManager.SENSOR_DELAY_GAME);
                      }
                      compassOn = ok;
                      if (!ok) js("window.__heading&&window.__heading(-1,0)");
                  });
              }
              void stopCompass() { runOnUiThread(() -> { compassOn = false; if (sm != null) sm.unregisterListener(this); }); }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  int t = e.sensor.getType();
                  if (t == Sensor.TYPE_ROTATION_VECTOR) SensorManager.getRotationMatrixFromVector(rot, e.values);
                  else {
                      if (t == Sensor.TYPE_ACCELEROMETER) { System.arraycopy(e.values, 0, grav, 0, 3); hasG = true; }
                      if (t == Sensor.TYPE_MAGNETIC_FIELD) { System.arraycopy(e.values, 0, mag, 0, 3); hasM = true; }
                      if (!hasG || !hasM || !SensorManager.getRotationMatrix(rot, null, grav, mag)) return;
                  }
                  long now = System.currentTimeMillis();
                  if (now - lastSend < 60) return;
                  lastSend = now;
                  SensorManager.getOrientation(rot, ori);
                  double az = Math.toDegrees(ori[0]);
                  int r = getWindowManager().getDefaultDisplay().getRotation();
                  az += r == Surface.ROTATION_90 ? 90 : r == Surface.ROTATION_180 ? 180 : r == Surface.ROTATION_270 ? 270 : 0;
                  az = (az % 360 + 360) % 360;
                  js("window.__heading&&window.__heading(" + String.format(java.util.Locale.US, "%.1f", az) + "," + acc + ")");
              }
              int acc = 3;
              @Override
              public void onAccuracyChanged(Sensor s, int a) { if (s.getType() == Sensor.TYPE_MAGNETIC_FIELD || s.getType() == Sensor.TYPE_ROTATION_VECTOR) acc = a; }

              @Override
              protected void onPause() { super.onPause(); if (sm != null) sm.unregisterListener(this); }
              @Override
              protected void onResume() { super.onResume(); if (compassOn) startCompass(); js("window.__resume&&window.__resume()"); }

              WebView web;
              private ValueCallback<Uri[]> fileCb;
              static final int FILE_REQ = 1;
              static final int PERM_LOC = 2;
              static final int PERM_NOTIF = 3;
              String pendingLocCb = null;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.parseColor("#0b5b47"));
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new AppBridge(this), "AppBridge");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (!r.isForMainFrame()) return false;
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), FILE_REQ); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
                  Scheduler.scheduleNext(this);
              }

              void setKeepScreenOn(boolean on) {
                  runOnUiThread(() -> {
                      if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  });
              }

              void js(final String code) {
                  runOnUiThread(() -> { try { web.evaluateJavascript(code, null); } catch (Exception e) { } });
              }

              void askLocation(String cb) {
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED
                          && checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      pendingLocCb = cb;
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, PERM_LOC);
                  } else {
                      Loc.get(this, cb);
                  }
              }

              void askNotifications() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, PERM_NOTIF);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] res) {
                  if (req == PERM_LOC && pendingLocCb != null) {
                      String cb = pendingLocCb; pendingLocCb = null;
                      boolean ok = false;
                      for (int r : res) if (r == PackageManager.PERMISSION_GRANTED) ok = true;
                      if (ok) Loc.get(this, cb);
                      else js("window.__nativeCb&&window.__nativeCb(" + AppBridge.q(cb) + ",false,'denied')");
                  }
                  if (req == PERM_NOTIF) Scheduler.scheduleNext(this);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

          cat > $P/app/src/main/java/ir/hashem/taqvim/Scheduler.java <<'EOF'
          package ir.hashem.taqvim;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Scheduler {
              static final String PREFS = "taqvim";
              static final String CH_STATUS = "status";
              static final String CH_ADHAN = "adhan2";
              static final int STATUS_ID = 1001;
              static final int ADHAN_ID = 1002;

              static int piFlags() {
                  return PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
              }

              static void channels(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  NotificationChannel st = new NotificationChannel(CH_STATUS, "اوقات شرعی (نوار وضعیت)", NotificationManager.IMPORTANCE_LOW);
                  st.setShowBadge(false);
                  nm.createNotificationChannel(st);
                  NotificationChannel ad = new NotificationChannel(CH_ADHAN, "اذان", NotificationManager.IMPORTANCE_HIGH);
                  ad.setSound(null, null);
                  nm.createNotificationChannel(ad);
              }

              static Notification.Builder builder(Context c, String ch) {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, ch) : new Notification.Builder(c);
                  return b.setSmallIcon(R.drawable.ic_stat);
              }

              static PendingIntent openApp(Context c) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(c, 0, i, piFlags());
              }

              static void scheduleNext(Context c) {
                  channels(c);
                  SharedPreferences p = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  boolean adhanOn = p.getBoolean("adhanOn", false);
                  boolean statusOn = p.getBoolean("statusOn", false);
                  JSONObject next = null;
                  long now = System.currentTimeMillis();
                  try {
                      JSONArray a = new JSONArray(p.getString("alarms", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          if (o.getLong("t") > now + 1000) { next = o; break; }
                      }
                  } catch (Exception e) { }

                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  Intent it = new Intent(c, AlarmReceiver.class);
                  if (next != null) {
                      it.putExtra("t", next.optLong("t"));
                      it.putExtra("n", next.optString("n"));
                      it.putExtra("u", next.optString("u"));
                      it.putExtra("a", next.optBoolean("a"));
                  }
                  PendingIntent pi = PendingIntent.getBroadcast(c, 7, it, piFlags());
                  if (am != null) {
                      am.cancel(pi);
                      if (next != null && (adhanOn || statusOn)) {
                          long t = next.optLong("t");
                          try {
                              boolean exact = Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms();
                              if (exact) am.setAlarmClock(new AlarmManager.AlarmClockInfo(t, openApp(c)), pi);
                              else if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                              else am.set(AlarmManager.RTC_WAKEUP, t, pi);
                          } catch (Exception e) {
                              try { am.set(AlarmManager.RTC_WAKEUP, t, pi); } catch (Exception e2) { }
                          }
                      }
                  }
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (statusOn && next != null) {
                      Notification.Builder b = builder(c, CH_STATUS)
                              .setContentTitle(next.optString("st"))
                              .setContentText(next.optString("sd"))
                              .setOngoing(true)
                              .setShowWhen(false)
                              .setContentIntent(openApp(c));
                      if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_LOW);
                      try { nm.notify(STATUS_ID, b.build()); } catch (Exception e) { }
                  } else {
                      nm.cancel(STATUS_ID);
                  }
              }
          }
          EOF

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release
        working-directory: android
        env:
          KS_PATH: ${{ github.workspace }}/release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          VCODE: ${{ github.run_number }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Rename files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TaqvimAhlSunnat.apk
          cp android/app/build/outputs/bundle/release/app-release.aab TaqvimAhlSunnat.aab

      - name: Upload APK (download from run summary)
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimAhlSunnat-apk
          path: |
            TaqvimAhlSunnat.apk
            TaqvimAhlSunnat.aab

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.${{ github.run_number }}
          name: "تقویم و اعمال روزانه اهل‌سنت - نسخه ${{ github.run_number }}"
          files: |
            TaqvimAhlSunnat.apk
            TaqvimAhlSunnat.aab
