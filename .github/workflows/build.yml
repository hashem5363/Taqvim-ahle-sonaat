name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        run: |
          set -e
          HTML=$(ls *.html | head -n 1)
          echo "Using $HTML"
          P=android
          mkdir -p $P/app/src/main/java/ir/hashem/taqvim $P/app/src/main/assets $P/app/src/main/res/mipmap-xxhdpi $P/app/src/main/res/drawable
          cp "$HTML" $P/app/src/main/assets/index.html
          echo "" | base64 -d > $P/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TaqvimAhlSunnat"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ir.hashem.taqvim'
              compileSdk 34
              defaultConfig {
                  applicationId "ir.hashem.taqvim"
                  minSdk 21
                  targetSdk 34
                  versionCode(Integer.parseInt(System.getenv("VCODE") ?: "1"))
                  versionName("3.0." + (System.getenv("VCODE") ?: "1"))
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "taqvim"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <application
                  android:label="تقویم و اعمال روزانه اهل‌سنت"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
