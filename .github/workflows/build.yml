              <path android:fillColor="#FFFFFFFF" android:pathData="M18,6l0.9,1.9 2.1,0.3 -1.5,1.5 0.4,2.1 -1.9,-1 -1.9,1 0.4,-2.1 -1.5,-1.5 2.1,-0.3z"/>
