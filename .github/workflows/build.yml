          cat > $P/app/src/main/java/ir/hashem/taqvim/AdhanService.java <<'EOF'
          package ir.hashem.taqvim;

          import android.app.Notification;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class AdhanService extends Service {
              private MediaPlayer mp;
              private Ringtone rt;

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent in, int flags, int id) {
                  if (in != null && "STOP".equals(in.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  String name = in != null ? in.getStringExtra("n") : null;
                  String url = in != null ? in.getStringExtra("u") : null;
                  if (name == null) name = "اذان";
                  Scheduler.channels(this);
                  Intent stop = new Intent(this, AdhanService.class).setAction("STOP");
                  PendingIntent sp = PendingIntent.getService(this, 9, stop, Scheduler.piFlags());
                  Notification n = Scheduler.builder(this, Scheduler.CH_ADHAN)
                          .setContentTitle(name)
                          .setContentText("الله أكبر، الله أكبر")
                          .setContentIntent(Scheduler.openApp(this))
                          .addAction(new Notification.Action.Builder(null, "توقف", sp).build())
                          .setDeleteIntent(sp)
                          .build();
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(Scheduler.ADHAN_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      else startForeground(Scheduler.ADHAN_ID, n);
                  } catch (Exception e) { }
                  play(url);
                  return START_NOT_STICKY;
              }

              private void play(String url) {
                  release();
                  try {
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                      mp.setWakeMode(this, PowerManager.PARTIAL_WAKE_LOCK);
                      mp.setDataSource(url);
                      mp.setOnPreparedListener(MediaPlayer::start);
                      mp.setOnCompletionListener(m -> stopSelf());
                      mp.setOnErrorListener((m, w, e) -> { fallback(); return true; });
                      mp.prepareAsync();
                  } catch (Exception e) { fallback(); }
              }

              private void fallback() {
                  try {
                      rt = RingtoneManager.getRingtone(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION));
                      if (rt != null) rt.play();
                  } catch (Exception e) { }
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(this::stopSelf, 15000);
              }

              private void release() {
                  if (mp != null) { try { mp.release(); } catch (Exception e) { } mp = null; }
              }

              @Override
              public void onDestroy() {
                  release();
                  if (rt != null) try { rt.stop(); } catch (Exception e) { }
                  super.onDestroy();
              }
          }
          EOF

          cat > $P/app/src/main/java/ir/hashem/taqvim/AlarmReceiver.java <<'EOF'
          package ir.hashem.taqvim;

          import android.app.Notification;
          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.RingtoneManager;
          import android.os.Build;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent in) {
                  SharedPreferences p = c.getSharedPreferences(Scheduler.PREFS, Context.MODE_PRIVATE);
                  long t = in.getLongExtra("t", 0);
                  boolean fresh = t > 0 && Math.abs(System.currentTimeMillis() - t) < 10 * 60000L;
                  if (fresh && p.getBoolean("adhanOn", false) && in.getBooleanExtra("a", false)) {
                      Intent s = new Intent(c, AdhanService.class);
                      s.putExtra("n", in.getStringExtra("n"));
                      s.putExtra("u", in.getStringExtra("u"));
                      try {
                          if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s); else c.startService(s);
                      } catch (Exception e) {
                          Scheduler.channels(c);
                          NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                          Notification.Builder b = Scheduler.builder(c, Scheduler.CH_ADHAN)
                                  .setContentTitle(in.getStringExtra("n"))
                                  .setContentText("الله أكبر")
                                  .setAutoCancel(true)
                                  .setContentIntent(Scheduler.openApp(c));
                          if (Build.VERSION.SDK_INT < 26) b.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION));
                          if (nm != null) try { nm.notify(Scheduler.ADHAN_ID, b.build()); } catch (Exception e2) { }
                      }
                  }
                  Scheduler.scheduleNext(c);
              }
          }
          EOF

          cat > $P/app/src/main/java/ir/hashem/taqvim/AppBridge.java <<'EOF'
          package ir.hashem.taqvim;

          import android.app.AlarmManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class AppBridge {
              private final MainActivity act;

              AppBridge(MainActivity a) { act = a; }

              static String q(String s) {
                  if (s == null) return "null";
                  StringBuilder b = new StringBuilder("\"");
                  for (char c : s.toCharArray()) {
                      if (c == '"' || c == '\\') b.append('\\').append(c);
                      else if (c == '\n') b.append("\\n");
                      else if (c == '\r') b.append("\\r");
                      else if (c == '\u2028' || c == '\u2029' || c < 0x20) b.append(String.format("\\u%04x", (int) c));
                      else b.append(c);
                  }
                  return b.append('"').toString();
              }

              @JavascriptInterface
              public boolean isNative() { return true; }

              @JavascriptInterface
              public void schedule(String json, boolean adhanOn, boolean statusOn) {
                  SharedPreferences p = act.getSharedPreferences(Scheduler.PREFS, Context.MODE_PRIVATE);
                  p.edit().putString("alarms", json).putBoolean("adhanOn", adhanOn).putBoolean("statusOn", statusOn).apply();
                  Scheduler.scheduleNext(act);
              }

              @JavascriptInterface
              public void speak(String text, String lang) { act.speak(text, lang); }

              @JavascriptInterface
              public void startCompass() { act.startCompass(); }

              @JavascriptInterface
              public void stopCompass() { act.stopCompass(); }

              @JavascriptInterface
              public void keepScreenOn(boolean on) { act.setKeepScreenOn(on); }

              @JavascriptInterface
              public void requestNotifications() { act.askNotifications(); }

              @JavascriptInterface
              public boolean canExact() {
                  if (Build.VERSION.SDK_INT < 31) return true;
                  AlarmManager am = (AlarmManager) act.getSystemService(Context.ALARM_SERVICE);
                  return am != null && am.canScheduleExactAlarms();
              }

              @JavascriptInterface
              public void openExactSettings() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      try {
                          Intent i = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:" + act.getPackageName()));
                          act.startActivity(i);
                      } catch (Exception e) { }
                  }
              }

              @JavascriptInterface
              public void stopAdhan() {
                  try { act.stopService(new Intent(act, AdhanService.class)); } catch (Exception e) { }
              }

              @JavascriptInterface
              public void getLocation(String cb) { act.runOnUiThread(() -> act.askLocation(cb)); }

              @JavascriptInterface
              public void httpGet(final String url, final String cb) {
                  new Thread(() -> {
                      String body = null; boolean ok = false;
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setConnectTimeout(15000); c.setReadTimeout(20000);
                          c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android) TaqvimApp");
                          c.setInstanceFollowRedirects(true);
                          InputStream in = c.getInputStream();
                          ByteArrayOutputStream out = new ByteArrayOutputStream();
                          byte[] buf = new byte[8192]; int n;
                          while ((n = in.read(buf)) > 0) { out.write(buf, 0, n); if (out.size() > 4000000) break; }
                          in.close();
                          body = out.toString("UTF-8"); ok = c.getResponseCode() < 400;
                      } catch (Exception e) { body = String.valueOf(e.getMessage()); }
                      act.js("window.__nativeCb&&window.__nativeCb(" + q(cb) + "," + ok + "," + q(body) + ")");
                  }).start();
              }
          }
          EOF

